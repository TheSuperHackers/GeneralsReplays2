;------------------------------------------------------------------------------
;Walls - This maps special!
;We add a Quad Cannon that oneshots Air and Ground units in a small range.
;It has Avengers Point Defence which counters any long range attack going to another base.
;Since attacking another players base outside of your 1v1 while the FFA Mode hasnt begun is a nono, we punish players with losses!
;Instead of just a simple wall, it destroys your units since you wanted to cheat!
;One thing that can pass is an Aurora, but on the way back it will die 100%, so it is still mostly a loss.

;------------------------------------------------------------------------------
Weapon n0ttwsQuadCannonGun
  PrimaryDamage         = 2000.0
  PrimaryDamageRadius   = 0.0       ; 0 primary radius means "hits only intended victim"
  AttackRange           = 90.0
  DamageType            = SMALL_ARMS
  DeathType             = NORMAL
  WeaponSpeed           = 999999.0          ; dist/sec (huge value == effectively instant)
  ProjectileObject      = NONE
  FireFX                = WeaponFX_QuadCannonGunFire
  VeterancyFireFX       = HEROIC WeaponFX_HeroicQuadCannonGunFire
  FireSound             = JarmenKellWeaponSnipe
  RadiusDamageAffects   = ALLIES ENEMIES NEUTRALS
  DelayBetweenShots     = 1 ;500               ; time between shots, msec
  ClipSize              = 0                    ; how many shots in a Clip (0 == infinite)
  ClipReloadTime        = 0              ; how long to reload a Clip, msec
  WeaponBonus           = PLAYER_UPGRADE DAMAGE 125% ; APBullets
End

;------------------------------------------------------------------------------
Weapon n0ttwsQuadCannonGunAir
  PrimaryDamage         = 2000.0
  PrimaryDamageRadius   = 0.0       ; 0 primary radius means "hits only intended victim"
  AttackRange           = 110.0
  DamageType            = SMALL_ARMS
  DeathType             = NORMAL
  WeaponSpeed           = 999999.0          ; dist/sec (huge value == effectively instant)
  ProjectileObject      = NONE
  FireFX                = WeaponFX_QuadCannonGunFire
  VeterancyFireFX       = HEROIC WeaponFX_HeroicQuadCannonGunFire
  FireSound             = JarmenKellWeaponSnipe
  RadiusDamageAffects   = ALLIES ENEMIES NEUTRALS
  DelayBetweenShots     = 1 ;500               ; time between shots, msec
  ClipSize              = 0                    ; how many shots in a Clip (0 == infinite)
  ClipReloadTime        = 0              ; how long to reload a Clip, msec
  AntiAirborneVehicle   = Yes
  AntiAirborneInfantry  = Yes
  AntiGround = No
  WeaponBonus           = PLAYER_UPGRADE DAMAGE 125% ; APBullets
End

;------------------------------------------------------------------------------
Weapon AdvancedWallPointDefence
  PrimaryDamage       = 100.0
  PrimaryDamageRadius = 0.0
  AttackRange         = 120.0 
  DamageType          = LASER
  DeathType           = LASERED
  WeaponSpeed         = 999999.0     ; dist/sec 
  DelayBetweenShots   = 1         ; time between shots, msec
  ClipSize            = 0            ; how many shots in a Clip (0 == infinite)
  ClipReloadTime      = 0            ; how long to reload a Clip, msec
  AcceptableAimDelta  = 180          ; Don't need to turn at all.
  AntiSmallMissile    = Yes
  AntiProjectile      = Yes
  LaserName           = AvengerPointDefenseLaserBeam
  LaserBoneName       = LazerSpot01
  FireFX              = WeaponFX_PaladinPointDefenseLaser
End

;------------------------------------------------------------------------------
Object Boss_TankAvenger
RemoveModule ModuleTag_01
RemoveModule ModuleTag_02
RemoveModule ModuleTag_03
RemoveModule ModuleTag_04
RemoveModule ModuleTag_Laser_One
RemoveModule ModuleTag_Laser_Two
RemoveModule ModuleTag_OverlordContain

 AddModule
  Draw = W3DTankTruckDraw ModuleTag_n0ttws01
    OkToChangeModelColor = Yes

    ConditionState = NONE
      Model = UVQuadCann
      Turret = TURRETUP02
      TurretPitch = TURRETEL02
      WeaponFireFXBone  = PRIMARY   BarrelUp02MS
      WeaponMuzzleFlash = PRIMARY   BarrelUp02FX
      WeaponRecoilBone  = PRIMARY   BarrelUp02
      WeaponFireFXBone  = SECONDARY BarrelUp02MS
      WeaponMuzzleFlash = SECONDARY BarrelUp02FX
      WeaponRecoilBone  = SECONDARY BarrelUp02
      HideSubObject = TURRETUP01 TURRET BarrelFX01 BarrelFX02 BarrelFX03 BarrelFX04 CHASSIS
      ShowSubObject = TURRETUP02
    End
      
    ConditionState = REALLYDAMAGED
      Model = UVQuadCann_D
      Turret = TURRETUP02
      TurretPitch = TURRETEL02
      WeaponFireFXBone  = PRIMARY   BarrelUp02MS
      WeaponMuzzleFlash = PRIMARY   BarrelUp02FX
      WeaponRecoilBone  = PRIMARY   BarrelUp02
      WeaponFireFXBone  = SECONDARY BarrelUp02MS
      WeaponMuzzleFlash = SECONDARY BarrelUp02FX
      WeaponRecoilBone  = SECONDARY BarrelUp02
      HideSubObject = TURRETUP01 TURRET BarrelFX01 BarrelFX02 BarrelFX03 BarrelFX04 CHASSIS
      ShowSubObject = TURRETUP02
    End
    
    ConditionState = RUBBLE
      Model = UVQuadCann_D
      Turret = TURRETUP02
      TurretPitch = TURRETEL02
      WeaponFireFXBone  = PRIMARY   BarrelUp02MS
      WeaponMuzzleFlash = PRIMARY   BarrelUp02FX
      WeaponRecoilBone  = PRIMARY   BarrelUp02
      WeaponFireFXBone  = SECONDARY BarrelUp02MS
      WeaponMuzzleFlash = SECONDARY BarrelUp02FX
      WeaponRecoilBone  = SECONDARY BarrelUp02
      HideSubObject = TURRETUP01 TURRET BarrelFX01 BarrelFX02 BarrelFX03 BarrelFX04 CHASSIS
      ShowSubObject = TURRETUP02
    End
  End
 End
 AddModule ;So the Quads turret isnt floating, we add this!
  Draw = W3DModelDraw ModuleTag_n0ttwsBunker01
    OkToChangeModelColor = Yes
    ConditionState = NONE
      Model         = CBBunker01_G
      Animation     = CBBunker01_G.CBBunker01_G
      AnimationMode = LOOP
    End
    ConditionState = DAMAGED
      Model         = CBBunker01_DG
      Animation     = CBBunker01_DG.CBBunker01_DG
      AnimationMode = LOOP
    End
    ConditionState = REALLYDAMAGED
      Model         = CBBunker01_EG
      Animation     = CBBunker01_EG.CBBunker01_EG
      AnimationMode = LOOP
    End
  End
 End

  WeaponSet
    Conditions = None 
    Weapon = PRIMARY n0ttwsQuadCannonGun
    Weapon = SECONDARY n0ttwsQuadCannonGunAir
  End
  WeaponSet
    Conditions = CRATEUPGRADE_ONE 
    Weapon = PRIMARY n0ttwsQuadCannonGun
    Weapon = SECONDARY n0ttwsQuadCannonGunAir
  End
  WeaponSet
    Conditions = CRATEUPGRADE_TWO 
    Weapon = PRIMARY n0ttwsQuadCannonGun
    Weapon = SECONDARY n0ttwsQuadCannonGunAir
  End
 AddModule
  Body = ImmortalBody ModuleTag_n0ttws02
    MaxHealth = 1
    InitialHealth = 1
  End
 End
 AddModule ;We dont want any of those sneaky attacks floating into another base! Not even Nuke Cannon shells!
  Behavior = PointDefenseLaserUpdate ModuleTag_n0ttwsLaserOne
    WeaponTemplate        = AdvancedWallPointDefence
    PrimaryTargetTypes    = BALLISTIC_MISSILE SMALL_MISSILE PROJECTILE
    ScanRate              = 0
    ScanRange             = 100.0
    PredictTargetVelocityFactor = 1.0
  End
 End
 AddModule
  Behavior = PointDefenseLaserUpdate ModuleTag_n0ttwsLaserTwo
    WeaponTemplate        = AdvancedWallPointDefence
    PrimaryTargetTypes    = BALLISTIC_MISSILE SMALL_MISSILE PROJECTILE
    ScanRate              = 0
    ScanRange             = 130.0
    PredictTargetVelocityFactor = 1.0
  End
 End
 AddModule
  Behavior = AIUpdateInterface ModuleTag_n0ttws03
    Turret
      TurretTurnRate = 360
      TurretPitchRate = 360
      AllowsPitch = Yes
      NaturalTurretPitch    = 25
      ControlledWeaponSlots = PRIMARY SECONDARY
      MinIdleScanInterval   = 500    ; in milliseconds
      MaxIdleScanInterval   = 500    ; in milliseconds
      MinIdleScanAngle      = 0       ; in degrees off the natural turret angle
      MaxIdleScanAngle      = 360     ; in degrees off the natural turret angle
    End
    AutoAcquireEnemiesWhenIdle = Yes Stealthed
    MoodAttackCheckRate        = 150
  End
 End
 AddModule
  Behavior = StealthDetectorUpdate ModuleTag_n0ttws04
    DetectionRate             = 180   ; how often to rescan for stealthed things in my sight (msec)
    DetectionRange            = 150 ;John, enable this for independant balancing!
    CanDetectWhileGarrisoned  = No ;Garrisoned means being in a structure that you units can shoot out of.
    CanDetectWhileContained   = No ;Contained means being in a transport or tunnel network.
    PingSound                 = IRPing
    LoudPingSound             = IRPingLoud
    IRBeaconParticleSysName   = IRLenzflare
    IRParticleSysBone         = IRFX
  End
 End
 ShroudRevealToAllRange = 50
 KindOf = -FORCEATTACKABLE +UNATTACKABLE
End

