;------------------------------------------------------------------------------
;Nuke Cannon Explosion FX and MOAB Explosion FX (no damage)
Object VericalArrowsRadiationFieldSmall
 AddModule
  Draw = W3DModelDraw ModuleTag_n0ttws01
    DefaultConditionState
      Model = NONE
    End
  End
 End
  KindOf = IMMOBILE CLEANUP_HAZARD INERT NO_COLLIDE
  ArmorSet
    Conditions      = None
    Armor           = HazardousMaterialArmor
  End
  SoundAmbient      = RadiationPoolAmbientLoop
 AddModule
  Body = ActiveBody ModuleTag_n0ttws02
    MaxHealth        = 120.0
    InitialHealth    = 120.0
  End
 End
 AddModule
  Behavior = FireWeaponUpdate ModuleTag_n0ttws03
    Weapon = SmallRadiationFieldWeapon
  End
 End
 AddModule
  Behavior = LifetimeUpdate ModuleTag_n0ttws04
    MinLifetime = 6000
    MaxLifetime = 8000
  End
 End
 AddModule
  Behavior = DestroyDie ModuleTag_n0ttws05
  End
 End
 AddModule
  Behavior = FXListDie ModuleTag_n0ttws06
    DeathFX = FX_RadiationPoolDie
  End
 End
  Geometry            = CYLINDER
  GeometryMajorRadius = 10.0
  GeometryHeight      = 1.0
  GeometryIsSmall     = No
End

ObjectCreationList OCL_VericalArrowsNukeRadiation
 CreateObject
   ObjectNames = VericalArrowsRadiationFieldSmall
   Disposition = ON_GROUND_ALIGNED
 End
End

