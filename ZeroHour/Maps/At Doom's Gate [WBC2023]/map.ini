Object FX_Tower_Firestorm

  ; *** ART Parameters ***
 AddModule
  Draw = W3DModelDraw ModuleTag_01
    DefaultConditionState
      Model = PABLINKLITER
    End
   End
  End

  ; ***DESIGN parameters ***
  DisplayName     = OBJECT:FireStorm
  EditorSorting = SYSTEM
  KindOf = IMMOBILE NO_COLLIDE

  ; *** ENGINEERING Parameters *** 
  
  AddModule
   Behavior = FirestormDynamicGeometryInfoUpdate ModuleTag_02
    InitialDelay       = 800
    InitialHeight      = 10.0
    InitialMajorRadius = 1.0

    FinalHeight        = 10.0
    FinalMajorRadius   = 90.0

    TransitionTime     = 9999
    ReverseAtTransitionTime = Yes

    ParticleOffsetZ = 1.00
    ParticleSystem1 = FX_TowerFirestorm
 ;   ParticleSystem2 = FX_TowerFirestormRingSmall
    
    DelayBetweenDamageFrames = 500  ;(in milliseconds)
    DamageAmount             = 0.0
    
   End
  End
  
  Geometry            = CYLINDER
  GeometryMajorRadius = 1.0
  GeometryMinorRadius = 1.0
  GeometryHeight      = 1.0
  GeometryIsSmall     = No
  
End

