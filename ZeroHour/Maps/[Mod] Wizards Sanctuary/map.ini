Object MogadishuMaleCivilian01

  ; *** ART Parameters ***
  SelectPortrait         = SAFence_L
  ButtonImage            = SAFence

  RemoveModule ModuleTag_01
  AddModule
  Draw = W3DModelDraw ModuleTag_01_Wiz
    DefaultConditionState
      Model = CIUMC01_SKN
      IdleAnimation = CIUMC01_SKL.CIUMC01_STN 0 30
      IdleAnimation = CIUMC01_SKL.CIUMC01_IDA
      ParticleSysBone     = SparksL01 WizardFog
      AnimationMode = ONCE
    End

    ConditionState = MOVING
      Animation = CIUMC01_SKL.CIUMC01_WKA 50
      AnimationMode = LOOP
      ParticleSysBone     = SparksL01 WizardFog
      Flags = RANDOMSTART
    End

    ConditionState = MOVING PANICKING
      Animation = CIUMC01_SKL.CIUMC01_PKA 20
      AnimationMode = LOOP
      Flags = RANDOMSTART
    End

    ConditionState = DYING
      Animation = CIUMC01_SKL.CIUMC01_DTA
      AnimationMode = ONCE
    End  
  End
  End

  ExperienceValue = 400 400 400 400    ;Experience point value at each level

  DisplayName = Wizard

  RadarPriority = UNIT
  KindOf = PRELOAD CAN_CAST_REFLECTIONS INFANTRY SELECTABLE IGNORES_SELECT_ALL EMP_HARDENED

  RemoveModule ModuleTag_02
  AddModule
   Body = ActiveBody ModuleTag_02_Wiz
    MaxHealth       = 500.0
    InitialHealth   = 500.0
   End
  End

  ; *** AUDIO Parameters ***
  ; Change voice to generic convoy truck sounds
  VoiceSelect = ConvoyTruckVoiceSelect
  VoiceMove = ConvoyTruckVoiceMove
  ; Remove the rest of the sounds
  VoiceAttack = NoSound
  VoiceGuard = NoSound
  VoiceFear = NoSound
  VoiceTaskComplete = NoSound

  Geometry = CYLINDER
  GeometryMajorRadius = 10.0
  GeometryMinorRadius = 10.0
  GeometryHeight = 12.0
  GeometryIsSmall = Yes
  Shadow = SHADOW_DECAL
  ShadowSizeX = 14;
  ShadowSizeY = 14;
  ShadowTexture = ShadowI;

End

