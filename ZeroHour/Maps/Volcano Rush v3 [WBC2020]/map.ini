;----------------------Water Settings-------------------------
WaterTransparency
TransparentWaterMinOpacity = 1.0 ;opacity of water at maximum depth - 1.0 is opaque, 5 transparent.
TransparentWaterDepth = 5.0 ;depth below water surface at which it becomes opaque (unless clipped by TransparentWaterMinOpacity)
StandingWaterTexture = tscloudsun.tga
StandingWaterColor = R:255 G:120 B:0
AdditiveBlending = No
RadarWaterColor = R:255 G:30 B:0
End

;----------------------Weather settings-----------------------
Weather
  SnowEnabled = yes
  SnowTexture = exfthrower03.dds
  
  SnowBoxDimensions = 100
  SnowBoxDensity = 0.2
 
  SnowFrequencyScaleX = 0.0533
  SnowFrequencyScaleY = 0.0275
 
  SnowAmplitude = 4.0
  SnowVelocity = 2.0
  SnowPointSize = .13
  SnowMaxPointSize = 10.0       ; maximum pixel size of point sprite particles (min-spec requires <= 64).
  SnowMinPointSize = 0.0        ; minimum pixel size of point sprite particles.

  SnowPointSprites = yes
  SnowQuadSize = 0.5
End

