  ClipSize              = 0                    ; how many shots in a Clip (0 == infinite)
  ClipReloadTime        = 0              ; how long to reload a Clip, msec
  ContinuousFireOne     = 5 ; How many shots at the same target constitute "Continuous Fire"
  ContinuousFireTwo     = 30 ; How many shots at the same target constitute "Continuous Fire Two"
  ContinuousFireCoast   = 0 ; msec we can coast without firing before we lose Continuous Fire
  WeaponBonus           = CONTINUOUS_FIRE_MEAN RATE_OF_FIRE 400% ; When the object achieves this state, this weapon gets double the rate of fire
  WeaponBonus           = CONTINUOUS_FIRE_FAST RATE_OF_FIRE 1500% ; This is not cumulative, so with Delay of 40, and values of 2 and 4 for these bonuses, you shoot at (40, 20, 10)
