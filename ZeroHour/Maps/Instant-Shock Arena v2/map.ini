Object RocksG11
  Shadow = NONE
End

Object RocksG12
  Shadow = NONE
End

Object RocksG15
  Shadow = NONE
End

Object RocksG16
  Shadow = NONE
End

Object RocksG17
  Shadow = NONE
End

Object RocksG18
  Shadow = NONE
End


;-------------------------------------
; The default SHADOW_DECAL blobs cause
; big dark marks on the cliffs as
; the trees are placed close to each
; other. This piece of code removes
; the shadows altogether.
;-------------------------------------

Object TreeFir03
  RemoveModule ModuleTag_01
  AddModule ModuleTag_NoYuckyShadows
    Draw = W3DTreeDraw ModuleTag_01
      ModelName = PTXFIR03
      TextureName = PTXFIR03.tga

      DoTopple = Yes
      DoShadow = No
      ToppleFX = FX_ToppleTree
      BounceFX = FX_OptTreeBounce
      KillWhenFinishedToppling = Yes
      SinkDistance = 10
      SinkTime = 5000
    End
  End

  Shadow = NONE
End


