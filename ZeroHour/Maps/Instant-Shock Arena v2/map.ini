;-------------------------------------
; For those of you panicking because a
; map.ini isn't cleared when playing
; another map, relax. I tested this.
; If you play on another map with a
; 'Shack' it shows on radar just fine.
;-------------------------------------

Object Shack
  RadarPriority = NOT_ON_RADAR
End

Object AmericaInfantryCIAOfficer
  RadarPriority = NOT_ON_RADAR
  Shadow = NONE
  Scale = 0.1
End


;-------------------------------------
; Combined, I have over 500 rocks. The
; reason I'm disabling their shadow is
; to releave the game engine so that
; it can render 3D shadows of other
; objects instead. 
;
; I was noticing 3D shadow errors when
; there were too many units on the 
; battlefield. This trick helped solve
; the issue somewhat without impacting
; visuals too much.
;-------------------------------------

Object RocksG02
  Shadow = NONE
End

Object RocksG07
  Shadow = NONE
End

Object RocksG09
  Shadow = NONE
End

Object RocksG10
  Shadow = NONE
