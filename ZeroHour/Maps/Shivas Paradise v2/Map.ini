;------------------------------------------------------------------------------
Object Boss_Barracks
 CommandSet = Boss_ChinaBarracksCommandSetNEW
 AddModule
   Behavior           = OCLSpecialPower ModuleTag_n0ttws01
    SpecialPowerTemplate = Superweaponn0ttwsParadrop
    OCL                  = SUPERWEAPON_n0ttws_Paradrop
    CreateLocation       = CREATE_AT_EDGE_NEAR_SOURCE
    OCLAdjustPositionToPassable = Yes ;Like RA2, shift target to passable cell so we don't land in water and on cliffs.
  End 
 End
End

