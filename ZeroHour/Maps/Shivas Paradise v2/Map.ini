;------------------------------------------------------------------------------
Object Boss_VehicleSentryDrone
RemoveModule ModuleTag_01
RemoveModule ModuleTag_03
 AddModule
  Draw = W3DTankDraw ModuleTag_n0ttws01
    InitialRecoilSpeed   = 10
    MaxRecoilDistance    = 1.5
    RecoilSettleSpeed    = 3
    OkToChangeModelColor = Yes
    DefaultConditionState
      Model                           = AVSENTRY
      Animation                       = AVSENTRY.AVSENTRY
      AnimationMode                   = LOOP
      Turret                          = TURRET01
      WeaponFireFXBone  = PRIMARY   TurretFX
      WeaponMuzzleFlash = PRIMARY   TurretFX
      WeaponRecoilBone  = PRIMARY   TurretUp
    End
    ConditionState                    = REALLYDAMAGED
      Turret                          = TURRET01
      Model                           = AVSENTRY_D
      Animation                       = AVSENTRY_D.AVSENTRY_D
      AnimationMode                   = LOOP
    End
    ConditionState                    = RUBBLE
      Model                           = AVSENTRY_D1
    End
      TrackMarks           = EXTnkTrack.tga
      TreadDebrisLeft      = SentryDroneTrackDebrisDirtLeft
      TreadDebrisRight     = SentryDroneTrackDebrisDirtRight
      TreadAnimationRate   = 4.0  ; amount of tread texture to move per second
    End
 End
  WeaponSet
    Conditions = None 
    Weapon = PRIMARY GattlingTankGun
  End
End


;-----------------------------------------------------------------------------
SpecialPower Superweaponn0ttwsParadrop
  Enum                = SPECIAL_PARADROP_AMERICA
  ReloadTime          = 120000   ; in milliseconds
  ; RequiredScience     = SCIENCE_Paradrop1
  PublicTimer         = Yes
  SharedSyncedTimer   = Yes
  RadiusCursorRadius  = 50
  ShortcutPower       = No     ;Capable of being fired by the side-bar shortcut.
  AcademyClassify     = ACT_SUPERPOWER ;Considered a powerful special power that a player could fire. Not for simpler unit based powers.
End

CommandButton Boss_Command_ConstructChinaVehicleHelix
  Command             = SPECIAL_POWER
  SpecialPower        = Superweaponn0ttwsParadrop
  Options             = NEED_TARGET_POS CONTEXTMODE_COMMAND ;NEED_SPECIAL_POWER_SCIENCE
  TextLabel           = CONTROLBAR:Paradrop
  ButtonImage         = SNHelix
  ButtonBorderType    = ACTION ; Identifier for the User as to what kind of button this is
  DescriptLabel       = CONTROLBAR:TooltipParaDrop
  RadiusCursorType    = PARADROP
  InvalidCursorName   = GenericInvalid
End

; -----------------------------------------------------------------------------
ObjectCreationList SUPERWEAPON_n0ttws_Paradrop
  DeliverPayload
    Transport = AmericaJetCargoPlane
    StartAtPreferredHeight = Yes
    StartAtMaxSpeed = Yes
    MaxAttempts = 4
    DropOffset = X:0 Y:0 Z:-10
    DropDelay = 150         ; time in between each item dropped (if more than one)
    ParachuteDirectly = Yes ; will tell all contained parachutes to go ahead and bunch
    PutInContainer = AmericaParachute
    Payload = AmericaInfantryRanger 4
    Payload = AmericaInfantryMissileDefender 3
    DeliveryDistance = 0  ;when outbound vehicle must be this close to target to continue delivery
    PreOpenDistance = 300 ;When inbound, vehicle can be this much farther than DeliveryDistance to begin delivery 
    DeliveryDecalRadius = 50
    DeliveryDecal
      Texture           = SCCParadrop_USA
      Style             = SHADOW_ALPHA_DECAL
      OpacityMin        = 25%
      OpacityMax        = 50%
      OpacityThrobTime  = 500
      Color             = R:227 G:229 B:22 A:255 
      OnlyVisibleToOwningPlayer = Yes
    End
    ;RequiresLivePlayer = Yes ; I want to require a live player, but I'll settle for dropping neutral rangers instead
  End
End

