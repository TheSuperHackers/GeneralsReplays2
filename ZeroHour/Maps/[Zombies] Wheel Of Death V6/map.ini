    RemovesUpgrades = Upgrade_GLAWorkerRealCommandSet
    CommandSet = Demo_GLAWorkerFakeBuildingsCommandSet
   End
   Behavior = CommandSetUpgrade ModuleTag_Fish2
    TriggeredBy = Upgrade_GLAWorkerRealCommandSet
    RemovesUpgrades = Upgrade_GLAWorkerFakeCommandSet Upgrade_GLAWorkerRealCommandSet
    CommandSet = Demo_GLAWorkerCommandSet
   End
   Behavior = MaxHealthUpgrade ModuleTag_Fish3
    TriggeredBy   = Upgrade_AmericaCompositeArmor
    AddMaxHealth  = 800.0
    ChangeType    = ADD_CURRENT_HEALTH_TOO   ;Choices are PRESERVE_RATIO, ADD_CURRENT_HEALTH_TOO, and SAME_CURRENTHEALTH
   End
   Behavior = TransportContain  ModuleTag_Fish4
    PassengersAllowedToFire = Yes
    Slots             = 6
    DamagePercentToUnits = 100% ;10%
    AllowInsideKindOf  = INFANTRY
    ExitDelay = 250
    NumberOfExitPaths = 3 ; Defaults to 1.  Set 0 to not use ExitStart/ExitEnd, set higher than 1 to use ExitStart01-nn/ExitEnd01-nn
    GoAggressiveOnExit = Yes ; AI Will tell people to set their mood to Aggressive on exiting
   End
   Behavior = LocomotorSetUpgrade ModuleTag_Fish5
    TriggeredBy = Upgrade_ChinaNuclearTanks
   End
   Behavior = ProductionUpdate ModuleTag_Fish6
    MaxQueueEntries = 9; So you can't build multiple upgrades in the same frame
   End
   Behavior           = OCLSpecialPower ModuleTag_FishParadrop
     SpecialPowerTemplate = SuperweaponParadropAmerica
     UpgradeOCL           = SCIENCE_Paradrop3 SUPERWEAPON_Paradrop3
     UpgradeOCL           = SCIENCE_Paradrop2 SUPERWEAPON_Paradrop2
     OCL                  = SUPERWEAPON_Paradrop1
     CreateLocation       = CREATE_AT_EDGE_NEAR_SOURCE
   End
   Behavior           = OCLSpecialPower ModuleTag_Carpet
    SpecialPowerTemplate = AirF_SuperweaponCarpetBomb
    OCL                  = AirF_SUPERWEAPON_CarpetBomb
    CreateLocation       = CREATE_AT_EDGE_NEAR_SOURCE
   End 
   Behavior = AutoHealBehavior ModuleTag_Fish7
    HealingAmount = 10
    HealingDelay = 1000 ; msec
    TriggeredBy = Upgrade_GLAJunkRepair
   End
  End
End

