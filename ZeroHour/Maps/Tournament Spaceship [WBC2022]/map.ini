;------------------------------------------
;-------Weather and Water Overrides--------
;------------------------------------------


WaterTransparency
  TransparentWaterMinOpacity = 1.0   ;opacity of water at maximum depth - 1.0 is opaque, 0 transparent.
  TransparentWaterDepth = 2.0       ;depth below water surface at which it becomes opaque (unless clipped by TransparentWaterMinOpacity)
  StandingWaterTexture = watersurfacebubbles.tga
  ;StandingWaterColor = R:0 G:0 B:0
  ;StandingWaterColor = R:0 G:0 B:0
  StandingWaterColor = R:10 G:10 B:10
  ;AdditiveBlending = Yes
  RadarWaterColor = R:20 G:20 B:20
End

Weather
 SnowEnabled = yes ; enable/disable snow on the map.
 SnowTexture = exdirtdebris.dds ;texture used for each snow particle.
 SnowBoxDimensions = 200 ; width/height of box around camera containing snow.
 SnowBoxDensity = 0.3 ; amount of snow particles per world-unit. Raise to increase particle count.
 SnowFrequencyScaleX = 0.0533 ;speed of side-to-side wave movement.
 SnowFrequencyScaleY = 0.0275 ;speed of side-to-side wave movement. 
 SnowAmplitude = 5.0 ;amount of side-to-side movement. 
 SnowVelocity = 1.0 ;speed at which snow falls
 SnowPointSize = 1.0 ;scale the size of snow particles.
 SnowMaxPointSize = 16.0 ; maximum pixel size of point sprite particles (min-spec requires <= 64).
 SnowMinPointSize = 8.0 ; minimum pixel size of point sprite particles.

 SnowPointSprites = yes ;set to "no" for point-sprite emulation.
 SnowQuadSize = 0.5 ;scale the size of snow particles when using point-sprite emulation.
End

