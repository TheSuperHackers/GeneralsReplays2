;------------------------------------------------------------------------------
Object BrickWallFAKE03

  ; *** ART Parameters ***
 AddModule
  Draw = W3DModelDraw ModuleTag_n0ttws01
    DefaultConditionState
      Model = PMWallBrk3
    End
    ConditionState = DAMAGED
      Model = PMWallBrk3_D
    End
    AliasConditionState = REALLYDAMAGED
    ConditionState = SNOW
      Model = PMWallBrk3_S
    End
    ConditionState = DAMAGED SNOW
      Model = PMWallBrk3_DS
    End
    AliasConditionState = REALLYDAMAGED SNOW
    ConditionState = RUBBLE
      Model = PMWallBrk3_R
    End
  End
 End

  DisplayName      = OBJECT:BrickWall
  KindOf = IMMOBILE FORCEATTACKABLE CLEARED_BY_BUILD

 AddModule
  Body            = ActiveBody ModuleTag_n0ttws02
    MaxHealth       = 1.0
    InitialHealth   = 1.0
  End
 End
  Shadow          = SHADOW_VOLUME

 AddModule
  Behavior = ToppleUpdate ModuleTag_n0ttws03
    ToppleFX = FX_BrickWallTopple
    ToppleLeftOrRightOnly = Yes
    ReorientToppledRubble = Yes
    BounceVelocityPercent = 0% ; most walls shouldn't bounce at all   (default: 30%)
    InitialAccelPercent = 3%   ; fences accelerate faster than trees (default: 1%)
  End
 End
 AddModule
  Behavior = SlowDeathBehavior ModuleTag_n0ttws04
    SinkRate          = 2     ; in Dist/Sec
    SinkDelay         = 5000
    DestructionDelay  = 10000
  End
 End

  Geometry            = BOX
  GeometryMajorRadius = 15.0
  GeometryMinorRadius = 1.0
  GeometryHeight      = 0.0
  GeometryIsSmall     = No

End

