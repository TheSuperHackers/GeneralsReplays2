;------------------------------------------------------------------------------
Object Hedge1FAKE

 AddModule
  Draw = W3DModelDraw ModuleTag_n0ttws01
    DefaultConditionState
      Model = PMHedge01
    End
  End
 End

  ; *** DESIGN parameters ***
  DisplayName      = OBJECT:Hedge
  KindOf          = IMMOBILE 

  Shadow          = SHADOW_VOLUME

 AddModule
  Behavior = ToppleUpdate ModuleTag_n0ttws02
    ToppleFX = FX_ToppleTree
    BounceFX = FX_TreeBounce
    ToppleLeftOrRightOnly = Yes
    BounceVelocityPercent = 20% ; hedges don't really bounce (much) (default: 30%)
  End
 End
 AddModule
  Behavior = SlowDeathBehavior ModuleTag_n0ttws03
    SinkRate          = 2     ; in Dist/Sec
    SinkDelay         = 5000
    DestructionDelay  = 10000
  End
 End

  Geometry            = BOX
  GeometryMajorRadius = 0.1
  GeometryMinorRadius = 0.1
  GeometryHeight      = 0.1
  GeometryIsSmall     = Yes

End

;------------------------------------------------------------------
Object ChainLinkFenceFAKE01
 AddModule
  Draw = W3DModelDraw ModuleTag_n0ttws01
    DefaultConditionState
      Model = PMWallChn1
    End
    ConditionState = DAMAGED
      Model = PMWallChn1_D
    End
    AliasConditionState = REALLYDAMAGED
    AliasConditionState = RUBBLE
  End
 End

  DisplayName      = OBJECT:ChainLinkFence
  KindOf = IMMOBILE FORCEATTACKABLE CAN_SEE_THROUGH_STRUCTURE CLEARED_BY_BUILD

 AddModule
  Body            = ActiveBody ModuleTag_n0ttws02
    MaxHealth       = 1.0
    InitialHealth   = 1.0
  End
 End

 AddModule
  Behavior = ToppleUpdate ModuleTag_n0ttws03
    ToppleFX = FX_ChainLinkFenceTopple
    BounceFX = FX_ChainLinkFenceBounce
    ToppleLeftOrRightOnly = Yes
    BounceVelocityPercent = 20% ; chainlink fences should bounce a little   (default: 30%)
    InitialAccelPercent = 3%   ; fences accelerate faster than trees (default: 1%)
  End
 End
 AddModule
  Behavior = SlowDeathBehavior ModuleTag_n0ttws04
    DeathTypes = NONE +TOPPLED
    SinkRate          = 2     ; in Dist/Sec
    SinkDelay         = 5000
    DestructionDelay  = 10000
  End
 End
 AddModule
  Behavior = DestroyDie ModuleTag_n0ttws05
    DeathTypes = ALL -TOPPLED
  End
 End

  Geometry            = BOX
  GeometryMajorRadius = 14.0
  GeometryMinorRadius = 1.0
  GeometryHeight      = 0.0
  GeometryIsSmall     = Yes
End

